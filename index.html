<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Contra NES Classic - 20 Levels</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Courier New', Courier, monospace; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    
    #game-container { position: relative; width: 100vw; height: 100vh; max-width: 900px; max-height: 500px; background: #000; overflow: hidden; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,255,0,0.3); }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    
    /* Overlay UI Screens */
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 10, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .hidden { display: none !important; }
    
    h1 { color: #ff3333; margin-bottom: 20px; text-shadow: 3px 3px 0px #000, -1px -1px 0 #fff; font-size: 32px; letter-spacing: 2px; text-align: center; }
    h2 { color: #ffcc00; margin-bottom: 15px; text-shadow: 2px 2px #000; }
    
    form, .menu-box { display: flex; flex-direction: column; width: 100%; max-width: 320px; gap: 12px; }
    input { padding: 12px; border-radius: 0; border: 2px solid #ff3333; background: #111; color: #00ff66; font-size: 16px; font-weight: bold; outline: none; }
    button { padding: 12px; border-radius: 0; border: 2px solid #fff; background: #ff3333; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; text-shadow: 1px 1px #000; }
    button:active { transform: scale(0.96); background: #cc0000; }
    .btn-secondary { background: #333; border-color: #aaa; color: #fff; }
    
    /* HUD Overlay */
    #hud { position: absolute; top: 10px; left: 15px; right: 15px; display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; color: #fff; z-index: 5; pointer-events: none; text-shadow: 2px 2px 0 #000; }
    .hud-lives { color: #ff3333; }
    
    /* Mobile Touch Controls */
    #touch-controls { position: absolute; bottom: 10px; left: 0; right: 0; height: 120px; display: flex; justify-content: space-between; padding: 0 15px; z-index: 6; pointer-events: none; }
    .touch-btn { width: 55px; height: 55px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; color: #fff; pointer-events: auto; touch-action: manipulation; }
    .d-pad { display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(2, 45px); gap: 5px; }
    .action-pad { display: flex; gap: 15px; align-items: flex-end; }
    .btn-fire { background: rgba(255, 50, 50, 0.5); width: 65px; height: 65px; }
    .btn-jump { background: rgba(50, 150, 255, 0.5); width: 65px; height: 65px; }
    
    /* Leaderboard Table */
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px; }
    th, td { padding: 8px; text-align: center; border-bottom: 1px solid #444; }
    th { color: #00ff66; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- HUD -->
  <div id="hud">
    <div>P1: <span id="hud-user">-</span></div>
    <div class="hud-lives">REST: <span id="hud-lives">♥♥♥</span></div>
    <div>SCORE: <span id="hud-score">0</span></div>
    <div>STAGE: <span id="hud-level">1/20</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Login/Register Screen -->
  <div id="auth-screen" class="screen">
    <h1>CONTRA NES</h1>
    <form id="auth-form">
      <input type="text" id="username" placeholder="USERNAME" required maxlength="12">
      <input type="password" id="password" placeholder="PASSWORD" required>
      <button type="submit" id="btn-login">LOGIN</button>
      <button type="button" id="btn-register" class="btn-secondary">REGISTER</button>
    </form>
    <p id="auth-msg" style="margin-top: 15px; color: #ff5555; font-size: 13px; text-align:center;"></p>
  </div>

  <!-- Main Menu Screen -->
  <div id="menu-screen" class="screen hidden">
    <h1>MAIN MENU</h1>
    <div class="menu-box">
      <button id="btn-play">START GAME</button>
      <button id="btn-leaderboard" class="btn-secondary">LEADERBOARD</button>
      <button id="btn-logout" style="background:#555; border-color:#888;">LOGOUT</button>
    </div>
  </div>

  <!-- Leaderboard Screen -->
  <div id="lb-screen" class="screen hidden">
    <h2>TOP HIGH SCORES</h2>
    <div style="max-height: 250px; overflow-y: auto; width: 100%; max-width: 380px;">
      <table id="lb-table">
        <thead>
          <tr><th>RANK</th><th>NAME</th><th>SCORE</th><th>STAGE</th></tr>
        </thead>
        <tbody id="lb-body"></tbody>
      </table>
    </div>
    <button id="btn-lb-back" class="btn-secondary" style="margin-top: 15px;">BACK TO MENU</button>
  </div>

  <!-- Touch Controls (Mobile) -->
  <div id="touch-controls">
    <div class="d-pad">
      <div></div>
      <div class="touch-btn" id="btn-up">▲</div>
      <div></div>
      <div class="touch-btn" id="btn-left">◄</div>
      <div></div>
      <div class="touch-btn" id="btn-right">►</div>
    </div>
    <div class="action-pad">
      <div class="touch-btn btn-jump" id="btn-jump">JUMP</div>
      <div class="touch-btn btn-fire" id="btn-fire">FIRE</div>
    </div>
  </div>
</div>

<script>
  // MASUKKAN URL DEPLOYMENT APPS SCRIPT ANDA DI SINI
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiQzkOtyQWV1HNJ57_QqznrDrwdAg2hA4ONrSE1eDaQ2GWTNrZhmNso_tjjrrc8t5a/exec";

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  canvas.width = 800;
  canvas.height = 400;

  // Global App States
  let currentUser = null;
  let userScore = 0;
  let userLevel = 1;
  let lives = 3;
  let gameRunning = false;
  let animationFrameId;

  const keys = { left: false, right: false, up: false, jump: false, fire: false };

  // DOM Elements
  const authScreen = document.getElementById('auth-screen');
  const menuScreen = document.getElementById('menu-screen');
  const lbScreen = document.getElementById('lb-screen');
  const authForm = document.getElementById('auth-form');
  const authMsg = document.getElementById('auth-msg');

  // API Integration via fetch (Text/plain)
  async function apiCall(data) {
    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      return await response.json();
    } catch (e) {
      console.error(e);
      alert("Gagal terhubung ke Google Sheets server!");
      return { result: "error" };
    }
  }

  // Auth Functions
  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authMsg.style.color = "#ffcc00";
    authMsg.innerText = "Connecting...";
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    
    const res = await apiCall({ action: "login", username: u, password: p });
    if (res.result === "success") {
      currentUser = u;
      userScore = res.score || 0;
      userLevel = res.level || 1;
      authMsg.innerText = "";
      showScreen(menuScreen);
      updateHUD();
    } else {
      authMsg.style.color = "#ff5555";
      authMsg.innerText = "Login Failed! Wrong username/password.";
    }
  });

  document.getElementById('btn-register').addEventListener('click', async () => {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    if(!u || !p) { authMsg.innerText = "Enter username & password!"; return; }
    authMsg.style.color = "#ffcc00";
    authMsg.innerText = "Registering...";
    
    const res = await apiCall({ action: "register", username: u, password: p });
    if (res.result === "registered") {
      authMsg.style.color = "#00ff66";
      authMsg.innerText = "Registration Success! Please click LOGIN.";
    } else {
      authMsg.style.color = "#ff5555";
      authMsg.innerText = "Username already exists!";
    }
  });

  document.getElementById('btn-play').addEventListener('click', () => {
    lives = 3;
    showScreen(null);
    startGame();
  });

  document.getElementById('btn-leaderboard').addEventListener('click', async () => {
    showScreen(lbScreen);
    const tbody = document.getElementById('lb-body');
    tbody.innerHTML = "<tr><td colspan='4'>Loading data...</td></tr>";
    
    const res = await apiCall({ action: "getLeaderboard" });
    if (res.result === "success") {
      tbody.innerHTML = "";
      if (res.leaderboard.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4'>No records found.</td></tr>";
      } else {
        res.leaderboard.forEach((item, index) => {
          tbody.innerHTML += `<tr>
            <td>${index + 1}</td>
            <td>${item.username}</td>
            <td>${item.score}</td>
            <td>Lvl ${item.level}</td>
          </tr>`;
        });
      }
    }
  });

  document.getElementById('btn-lb-back').addEventListener('click', () => showScreen(menuScreen));
  document.getElementById('btn-logout').addEventListener('click', () => {
    currentUser = null;
    showScreen(authScreen);
  });

  function showScreen(screen) {
    [authScreen, menuScreen, lbScreen].forEach(s => s.classList.add('hidden'));
    if (screen) screen.classList.remove('hidden');
  }

  function updateHUD() {
    document.getElementById('hud-user').innerText = currentUser || '-';
    document.getElementById('hud-lives').innerText = '♥'.repeat(Math.max(0, lives));
    document.getElementById('hud-score').innerText = userScore;
    document.getElementById('hud-level').innerText = `${userLevel}/20`;
  }

  // Keyboard & Touch Listeners
  window.addEventListener('keydown', e => handleKey(e.code, true));
  window.addEventListener('keyup', e => handleKey(e.code, false));

  function handleKey(code, isPressed) {
    if (code === 'ArrowLeft' || code === 'KeyA') keys.left = isPressed;
    if (code === 'ArrowRight' || code === 'KeyD') keys.right = isPressed;
    if (code === 'ArrowUp' || code === 'KeyW') keys.up = isPressed;
    if (code === 'Space' || code === 'KeyK') keys.jump = isPressed;
    if (code === 'KeyJ' || code === 'KeyZ') keys.fire = isPressed;
  }

  function bindTouch(id, keyProp) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); keys[keyProp] = true; };
    const end = (e) => { e.preventDefault(); keys[keyProp] = false; };
    el.addEventListener('touchstart', start);
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
  }
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-up', 'up');
  bindTouch('btn-jump', 'jump');
  bindTouch('btn-fire', 'fire');

  // --- GAME ENGINE & CONTRA NES BACKGROUND RENDERING ---
  let player, bullets, enemies, enemyBullets, platforms, finishLine;

  function drawContraBackground(offsetX) {
    // 1. Langit Malam Hitam/Biru Tua
    ctx.fillStyle = '#050a18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Bintang-Bintang Latar Belakang
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 30; i++) {
      let starX = (i * 90 + offsetX * 0.1) % canvas.width;
      if (starX < 0) starX += canvas.width;
      let starY = (i * 37) % 120;
      ctx.fillRect(starX, starY, 2, 2);
    }

    // 2. Gunung Salju Putih Tajam (Latar Belakang - Parallax 0.2)
    ctx.fillStyle = '#e6e6e6';
    for (let i = -1; i < 10; i++) {
      let gx = i * 140 + (offsetX * 0.2) % 140;
      ctx.beginPath();
      ctx.moveTo(gx, 160);
      ctx.lineTo(gx + 40, 60); // Puncak
      ctx.lineTo(gx + 80, 160);
      ctx.closePath();
      ctx.fill();

      // Bayangan Gunung Salju
      ctx.fillStyle = '#a0a0c0';
      ctx.beginPath();
      ctx.moveTo(gx + 40, 60);
      ctx.lineTo(gx + 80, 160);
      ctx.lineTo(gx + 40, 160);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e6e6e6';
    }

    // 3. Pohon Palem/Hutan Hijau (Latar Tengah - Parallax 0.5)
    for (let i = -2; i < 20; i++) {
      let hx = i * 60 + (offsetX * 0.5) % 60;
      // Batang pohon & daun
      ctx.fillStyle = '#005500';
      ctx.fillRect(hx + 20, 140, 10, 40);
      ctx.fillStyle = '#00aa00';
      ctx.beginPath();
      ctx.arc(hx + 25, 130, 25, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawRockPlatform(p) {
    // Permukaan Atas Rumput Hijau
    ctx.fillStyle = '#00cc00';
    ctx.fillRect(p.x, p.y, p.w, 8);

    // Dinding Batu Cokelat
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(p.x, p.y + 8, p.w, p.h - 8);

    // Tekstur Batu Cokelat Tua
    ctx.fillStyle = '#5c2d0c';
    for (let bx = p.x; bx < p.x + p.w; bx += 20) {
      for (let by = p.y + 12; by < p.y + p.h; by += 15) {
        ctx.fillRect(bx + (by % 10), by, 12, 8);
      }
    }
  }

  function drawWater(x, y, w, h) {
    ctx.fillStyle = '#0055ff';
    ctx.fillRect(x, y, w, h);
    // Ombak Kecil Putih
    ctx.fillStyle = '#88ccff';
    let waveTime = Date.now() / 300;
    for (let wx = x; wx < x + w; wx += 20) {
      let wy = y + Math.sin(waveTime + wx) * 3 + 5;
      ctx.fillRect(wx, wy, 10, 3);
    }
  }

  class Player {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = 80;
      this.y = 150;
      this.w = 24;
      this.h = 42;
      this.vx = 0;
      this.vy = 0;
      this.speed = 3.8;
      this.jumpPower = -10.5;
      this.grounded = false;
      this.lastShoot = 0;
      this.invulnerable = 60; // Frame kebal saat respawn
    }

    update() {
      if (this.invulnerable > 0) this.invulnerable--;

      if (keys.left) this.vx = -this.speed;
      else if (keys.right) this.vx = this.speed;
      else this.vx = 0;

      if (keys.jump && this.grounded) {
        this.vy = this.jumpPower;
        this.grounded = false;
      }

      // Tembak
      if (keys.fire && Date.now() - this.lastShoot > 140) {
        let bvx = keys.left ? -9 : 9;
        let bvy = keys.up ? -6 : 0;
        bullets.push(new Bullet(this.x + (keys.left ? 0 : this.w), this.y + 12, bvx, bvy, true));
        this.lastShoot = Date.now();
      }

      this.vy += 0.55; // Gravitasi
      this.x += this.vx;
      this.y += this.vy;

      if (this.x < 0) this.x = 0;

      // Tabrakan Platform
      this.grounded = false;
      platforms.forEach(p => {
        if (this.x + this.w > p.x && this.x < p.x + p.w &&
            this.y + this.h >= p.y && this.y + this.h <= p.y + p.h + 10 && this.vy >= 0) {
          this.grounded = true;
          this.vy = 0;
          this.y = p.y - this.h;
        }
      });

      // Jatuh ke air/jurang
      if (this.y > canvas.height - 20) {
        this.hit();
      }
    }

    draw() {
      if (this.invulnerable % 6 >= 3) return; // Kedip saat kedap peluru
      
      // Karakter Kontra Celana Biru/Merah
      ctx.fillStyle = '#ff9966'; // Kulit
      ctx.fillRect(this.x + 4, this.y, 16, 12);
      ctx.fillStyle = '#0055ff'; // Celana Biru
      ctx.fillRect(this.x + 4, this.y + 12, 16, 20);
      ctx.fillStyle = '#333'; // Sepatu
      ctx.fillRect(this.x + 2, this.y + 32, 20, 10);

      // Senjata
      ctx.fillStyle = '#cccccc';
      let gunX = keys.left ? this.x - 8 : this.x + this.w;
      ctx.fillRect(gunX, this.y + 14, 10, 5);
    }

    hit() {
      if (this.invulnerable > 0) return;
      lives--;
      updateHUD();
      if (lives <= 0) {
        gameOver();
      } else {
        this.reset();
      }
    }
  }

  class Bullet {
    constructor(x, y, vx, vy, isPlayer = false) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.r = isPlayer ? 4 : 5;
      this.isPlayer = isPlayer;
    }
    update() { this.x += this.vx; this.y += this.vy; }
    draw() {
      ctx.fillStyle = this.isPlayer ? '#ffcc00' : '#ff0000';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Enemy {
    constructor(x, y, type, shootInterval) {
      this.x = x; this.y = y; this.w = 24; this.h = 36;
      this.type = type; // 1: Jalan, 2: Penembak
      this.vx = type === 1 ? -1.5 : 0;
      this.shootInterval = shootInterval;
      this.lastShoot = Date.now() + Math.random() * 1000;
    }

    update() {
      this.x += this.vx;

      // Musuh Tipe Penembak
      if (this.type === 2 && Date.now() - this.lastShoot > this.shootInterval) {
        // Tembak lurus ke kiri mengarah ke player
        let bulletSpeed = Math.min(4 + userLevel * 0.3, 9);
        enemyBullets.push(new Bullet(this.x, this.y + 12, -bulletSpeed, 0, false));
        this.lastShoot = Date.now();
      }
    }

    draw() {
      // Musuh Baju Merah khas Contra
      ctx.fillStyle = '#cc0000';
      ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.fillStyle = '#ff9966';
      ctx.fillRect(this.x + 2, this.y + 2, 20, 10);
    }
  }

  function generateLevel(lvl) {
    platforms = [];
    enemies = [];
    
    // Dasar Tebing Utama
    platforms.push({ x: 0, y: 300, w: 500, h: 100 });
    
    // Rintangan Platform Bertingkat
    let totalSections = 12 + lvl * 2;
    let currentX = 500;

    for (let i = 0; i < totalSections; i++) {
      let gap = 80 + Math.random() * 60;
      let pWidth = 150 + Math.random() * 100;
      let pY = 220 + (i % 3) * 40;

      currentX += gap;
      platforms.push({ x: currentX, y: pY, w: pWidth, h: 180 });

      // Tambahkan musuh di tiap platform berdasarkan Level
      let shootFreq = Math.max(800, 2500 - lvl * 90); // Semakin tinggi level semakin cepat menembak
      if (Math.random() > 0.3) {
        let eType = (Math.random() > 0.4 || lvl > 3) ? 2 : 1;
        enemies.push(new Enemy(currentX + pWidth / 2, pY - 36, eType, shootFreq));
      }

      currentX += pWidth;
    }

    // Garis Akhir Level (Finish)
    finishLine = currentX + 100;
    platforms.push({ x: finishLine - 50, y: 280, w: 300, h: 120 });
  }

  function startGame() {
    player = new Player();
    bullets = [];
    enemyBullets = [];
    generateLevel(userLevel);
    gameRunning = true;
    updateHUD();
    gameLoop();
  }

  function gameLoop() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Hitung Kamera Follow Player
    let offsetX = -player.x + 120;
    if (offsetX > 0) offsetX = 0;

    // Render Latar Belakang Klasik Contra
    drawContraBackground(offsetX);

    ctx.save();
    ctx.translate(offsetX, 0);

    // Render Air di Dasar Layar
    drawWater(-200, 370, finishLine + 500, 40);

    // Render Platforms Batu Tebing
    platforms.forEach(p => drawRockPlatform(p));

    // Render Helikopter/Garis Finish
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(finishLine, 180, 12, 120);

    // Update & Render Player
    player.update();
    player.draw();

    // Update & Render Peluru Player
    bullets.forEach((b, i) => {
      b.update();
      b.draw();

      // Hit Musuh
      enemies.forEach((e, ei) => {
        if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
          enemies.splice(ei, 1);
          bullets.splice(i, 1);
          userScore += 100;
          updateHUD();
        }
      });

      if (b.x > player.x + 800 || b.x < player.x - 200) bullets.splice(i, 1);
    });

    // Update & Render Peluru Musuh
    enemyBullets.forEach((eb, i) => {
      eb.update();
      eb.draw();

      // Hit Player
      if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
        enemyBullets.splice(i, 1);
        player.hit();
      }

      if (eb.x < player.x - 500) enemyBullets.splice(i, 1);
    });

    // Update & Render Musuh
    enemies.forEach((e) => {
      e.update();
      e.draw();

      // Sentuhan Langsung Musuh ke Player
      if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
        player.hit();
      }
    });

    // Menang Level (Finish Line)
    if (player.x >= finishLine) {
      levelComplete();
      ctx.restore();
      return;
    }

    ctx.restore();
    animationFrameId = requestAnimationFrame(gameLoop);
  }

  async function levelComplete() {
    gameRunning = false;
    cancelAnimationFrame(animationFrameId);
    
    userScore += 500 + (lives * 100);
    if (userLevel < 20) {
      userLevel++;
      alert(`STAGE ${userLevel - 1} CLEAR! Entering Stage ${userLevel}`);
      await apiCall({ action: "updateScore", username: currentUser, score: userScore, level: userLevel });
      startGame();
    } else {
      alert(`CONGRATULATIONS! YOU BEAT ALL 20 STAGES!`);
      await apiCall({ action: "updateScore", username: currentUser, score: userScore, level: userLevel });
      showScreen(menuScreen);
    }
  }

  async function gameOver() {
    gameRunning = false;
    cancelAnimationFrame(animationFrameId);
    alert("GAME OVER!");
    await apiCall({ action: "updateScore", username: currentUser, score: userScore, level: userLevel });
    showScreen(menuScreen);
  }
</script>
</body>
</html>
